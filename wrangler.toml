# Cloudflare Worker & Pages Configuration for WacPad
# https://developers.cloudflare.com/workers/static-assets/

name = "wacpad-site"
main = "worker.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

# Native Cloudflare D1 SQL Database Binding
# Bound in Cloudflare Pages Dashboard -> Settings -> Functions -> D1 Database Bindings
[[d1_databases]]
binding = "wacpad binding"
database_name = "wacpad-db"
database_id = "5f47ef97-ae6a-4211-a170-831d342cc19b"

[vars]
NODE_ENV = "production"
DODO_ENV = "test_mode"
DODO_PRODUCT_ID = "pdt_0NpqdjR6faKYqLtCgr6Ma"
RAZORPAY_KEY_ID = "rzp_test_ToUiqcDV3uJUSh"
