# Cloudflare Worker & Pages Configuration for WacPad
# https://developers.cloudflare.com/workers/static-assets/

name = "wacpad-site"
main = "worker.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
NODE_ENV = "production"
